# Signing secrets are used only for v* tags and for dispatches from main; any other
# dispatch builds an unsigned snapshot because sign-macos.sh skips when APPLE_TEAM_ID is unset.
# A run that would publish without signing fails before anything is built.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build a snapshot without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: macos-latest
    environment: release
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - name: Refuse to publish unsigned binaries
        if: env.SIGN != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          echo "::error::This run would publish unsigned binaries. A real release needs a v* tag on main; dispatch from any other branch with dry_run for a snapshot."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Import Apple signing certificate
        if: env.SIGN == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ env.SIGN == 'true' && secrets.HOMEBREW_TAP_TOKEN || '' }}
          APPLE_ID: ${{ env.SIGN == 'true' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ env.SIGN == 'true' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.SIGN == 'true' && secrets.APPLE_TEAM_ID || '' }}

      - name: Upload snapshot artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snapshot-dist
          path: dist/*
          retention-days: 14

      - name: Clean up keychain
        if: always() && env.SIGN == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
