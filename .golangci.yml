version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - asasalint
    - bodyclose
    - errorlint

  settings:
    errcheck:
      check-blank: false
    staticcheck:
      checks:
        - all
        - -ST1000

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
